spring.application.name=fact-knowledge-layer

# --- Database ---
# Default: file-based H2 so the project runs out of the box with zero setup.
# To use Postgres instead, comment the H2 block out and uncomment the Postgres block below.
spring.datasource.url=jdbc:h2:file:./data/fkl;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# spring.datasource.url=jdbc:postgresql://localhost:5432/fact_knowledge_layer
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# --- File upload ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- LLM: free-tier Google Gemini API ---
# Get a free key (no credit card required) at https://aistudio.google.com/apikey
# then export it: export GEMINI_API_KEY=...
llm.api.key=${GEMINI_API_KEY:}
llm.api.url=https://generativelanguage.googleapis.com/v1beta/models
llm.api.model=gemini-3.6-flash
llm.api.max-tokens=16000

# --- Extraction tuning ---
# Documents longer than this (in characters) are split into chunks before extraction.
fkl.extraction.chunk-size=40000
fkl.extraction.chunk-overlap=1000
# Facts below this confidence are flagged for review instead of silently kept.
fkl.extraction.min-confidence=0.4

logging.level.com.superjoin.fact_knowledge_layer=INFO
